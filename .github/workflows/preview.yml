name: Preview

on:
  push:
    branches-ignore:
      - main

concurrency: preview-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  preview:
    name: Preview
    if: github.repository_owner == 'isaac-mason'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Build packages
        run: ./ci/build-packages.sh
        shell: bash

      - name: Test
        run: pnpm test

      - name: Build website
        run: pnpm build:website

      # navmesh website
      - name: NavMesh Website - Pull Vercel Environment Information
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NAVMESH_WEBSITE_PROJECT_ID }}

      - name: NavMesh Website - Build Project Artifacts
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NAVMESH_WEBSITE_PROJECT_ID }}

      - name: NavMesh Website - Deploy Project Artifacts to Vercel
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        run: pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NAVMESH_WEBSITE_PROJECT_ID }}
